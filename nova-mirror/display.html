<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Nova-Mirror Display</title>
  <style>
    body {
      margin: 0;
      background: black;
      height: 100vh;
      overflow: hidden;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(8, 1fr);
      height: 100vh;
      width: 100vw;
      gap: 16px;
      padding: 24px;
      box-sizing: border-box;
    }

    .widget {
      min-width: 0;
      min-height: 0;
    }

    .widget-card {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: -apple-system, sans-serif;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    body.debug .widget-card {
      outline: 1px dashed rgba(255, 255, 255, 0.3);
    }

    .clock-time {
      font-size: 2.5rem;
      font-weight: 600;
    }

    .clock-date {
      font-size: 1rem;
      opacity: 0.7;
      margin-top: 4px;
    }

    .weather-temp {
      font-size: 2.5rem;
      font-weight: 600;
    }

    .weather-desc {
      font-size: 1rem;
      opacity: 0.7;
      margin-top: 4px;
    }

    .weather-location {
      font-size: 0.85rem;
      opacity: 0.5;
      margin-top: 2px;
    }

    .fallback {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.5);
      font-family: -apple-system, sans-serif;
      text-align: center;
    }

    .fallback-title {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .fallback-hint {
      font-size: 0.9rem;
    }
  </style>
  <script src="widgets/registry.js"></script>
  <script src="widgets/clock.js"></script>
  <script src="widgets/weather.js"></script>
  <script src="widgets/calendar.js"></script>
</head>
<body>
  <div id="grid"></div>
  <script>
    const DEBUG_GRID = true;
    if (DEBUG_GRID) {
      document.body.classList.add("debug");
    }

    let lastConfigJSON = null;
    let cleanupFns = [];

    function showFallback(title, hint) {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      grid.style.display = "block";

      const fallback = document.createElement("div");
      fallback.className = "fallback";

      const titleEl = document.createElement("div");
      titleEl.className = "fallback-title";
      titleEl.textContent = title;

      const hintEl = document.createElement("div");
      hintEl.className = "fallback-hint";
      hintEl.textContent = hint;

      fallback.appendChild(titleEl);
      fallback.appendChild(hintEl);
      grid.appendChild(fallback);
    }

    function renderWidgets(config) {
      cleanupFns.forEach(fn => fn());
      cleanupFns = [];

      const grid = document.getElementById("grid");
      grid.style.display = "grid";
      grid.innerHTML = "";

      if (!config.widgets || config.widgets.length === 0) {
        showFallback("Noch keine Widgets eingerichtet", "Öffne den Konfigurator, um welche hinzuzufügen.");
        return;
      }

      config.widgets.forEach(widget => {
        const wrapper = document.createElement("div");
        wrapper.className = "widget";
        wrapper.style.gridColumn = `${widget.x} / ${widget.x + widget.w}`;
        wrapper.style.gridRow = `${widget.y} / ${widget.y + widget.h}`;

        const card = document.createElement("div");
        card.className = "widget-card";

        const meta = NOVA_WIDGETS[widget.type];
        if (meta && meta.render) {
          const cleanup = meta.render(card, widget);
          if (cleanup) {
            cleanupFns.push(cleanup);
          }
        } else {
          card.textContent = (meta?.label || widget.type) + " (noch kein Inhalt)";
        }

        wrapper.appendChild(card);
        grid.appendChild(wrapper);
      });
    }

    function pollConfig() {
      fetch("/api/config")
        .then(response => response.json())
        .then(config => {
          const configJSON = JSON.stringify(config);
          if (configJSON !== lastConfigJSON) {
            lastConfigJSON = configJSON;
            renderWidgets(config);
          }
        })
        .catch(() => {
          showFallback("Konfiguration nicht erreichbar", "Läuft der Server? Prüfe die Verbindung zum Pi.");
        });
    }

    pollConfig();
    setInterval(pollConfig, 5000);
  </script>
</body>
</html>
